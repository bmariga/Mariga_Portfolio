    <div class="contact-heading">
      <p class="kicker">Get in touch</p>
      <h2>I'm always open to new conversations, new places and new stories. If something in my work speaks to you, don't hesitate to reach out.</h2>
    </div>

    <div class="contact-form-wrap">
      <form action="https://formspree.io/f/xvkoqdwy" method="POST">
        <div class="field">
          <label for="email" color:var(--brass);>Email</label>
          <input id="email" name="email" type="email" placeholder="you@email.com" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell me a bit about the project..." required></textarea>
        </div>
        <button type="submit" class="btn">Send message →</button>
      </form>
    </div>
  </div>
</section>
